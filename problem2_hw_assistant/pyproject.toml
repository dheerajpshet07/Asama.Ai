[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hwqa"
version = "0.1.0"
description = "Ask questions about your Linux laptop's hardware in plain language"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []   # standard library only

[project.optional-dependencies]
anthropic = ["anthropic"]
test = ["pytest"]

[project.scripts]
hwqa = "hwqa.cli:main"

[tool.setuptools.packages.find]
include = ["hwqa*"]
